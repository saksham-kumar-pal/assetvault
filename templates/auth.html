{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-md-4"><div class="card p-4 shadow-sm">
<h4 class="mb-3">{{ 'Create account' if mode == 'register' else 'Login' }}</h4>
<form method="post">
<input class="form-control mb-3" name="username" placeholder="Username" required>
<input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
<button class="btn btn-primary w-100">{{ 'Register' if mode == 'register' else 'Login' }}</button>
</form>
<div class="alert alert-secondary py-2 small mt-3 mb-0">Demo login: <b>demo</b> / <b>demo123</b></div>
<div class="mt-3 small">
{% if mode == 'login' %}No account? <a href="{{ url_for('register') }}">Register</a>
{% else %}Have an account? <a href="{{ url_for('login') }}">Login</a>{% endif %}</div>
</div></div></div>{% endblock %}
